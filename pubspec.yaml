name: edumind_intro_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network Dependencies
  http: ^1.4.0

  # Core Dependencies
  get_it: ^8.0.3
  equatable: ^2.0.7
  path: ^1.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5

  # State Management
  flutter_bloc: ^9.1.1

  # Utility Dependencies
  kartal: ^4.0.4
  flutter_svg: ^2.1.0
  drop_down_search_field: ^1.1.3
  uuid: ^4.5.1
  record: ^6.0.0
  cached_network_image: ^3.4.1
  rename: ^3.1.0

  # Navigation Dependencies
  auto_route: ^9.2.2

  # Module
  gen:
    path: package/gen

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^7.0.0
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_app.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  remove_alpha_android: true

flutter:
  uses-material-design: true

  assets:
    - assets/books/
    - assets/jpg/
    - assets/icon/